name: Release

on:
  push:
    tags:
      # Match the release identity shape exactly. GitHub's tag filter has no
      # regex, so the YYYYMMDD-HHMMSS-<8hex> form is spelled out as character
      # classes. scripts/release-tag.sh still validates the tag against the
      # commit; this keeps unrelated tags from starting a release run at all.
      - "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]"

permissions:
  contents: read

jobs:
  release:
    uses: cgraf78/actions/.github/workflows/rust-release.yml@91e2e7eda4d27be9936d7ef09755ba063619fdbb
    permissions:
      contents: write
    with:
      android-aarch64: true
      # Hive Memory's public version is generated from the UTC committer
      # timestamp plus the commit suffix, not from Cargo.toml semver. Ask the
      # shared workflow to validate the exact release tag instead of forcing
      # this repo through Cargo's semver-oriented `version-command` +
      # `tag-prefix` path.
      tag-command: scripts/release-tag.sh
      package-command: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command: scripts/smoke-release.sh "$ASSET_PLATFORM"
