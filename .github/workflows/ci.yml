name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Stagger sibling repositories so their full matrices and advisory audits
    # do not compete for the same hosted-runner capacity at the top of the hour.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@2a6119d7886443929e1961a0e11b8dafa71c1978
    with:
      android-package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        scripts/smoke-release.sh "$ASSET_PLATFORM"
      # Release archives are the fleet bootstrap contract, so regular CI should
      # exercise the same Linux musl label that tagged releases publish instead
      # of waiting until a tag push discovers drift. `shdeps` and `grafhome-ca`
      # already gate on this; Hive Memory only covered the Android artifact.
      # Hive's dependency graph is pure Rust, so the shared default adds only
      # the target and deliberately skips the optional host musl linker.
      package-smoke-musl-target: x86_64-unknown-linux-musl
      package-smoke-command: |
        archive=$(scripts/package-release.sh "$RUST_TARGET" linux-x86_64-musl)
        scripts/smoke-release.sh linux-x86_64-musl
        install_root=$(mktemp -d)
        trap 'rm -rf "$install_root"' EXIT
        mkdir -p "$install_root/home"
        HOME="$install_root/home" ./install.sh --archive "$archive" \
          --data-home "$install_root/data" --bin-dir "$install_root/bin" \
          --man-dir "$install_root/man"
        "$install_root/bin/hm" --version
        test -f "$install_root/data/cgraf78/hive-memory/man/man1/hm.1"
      termux-command: scripts/termux-ci.sh
      # CI runs the official Termux APK in an x86_64 Android emulator, so this
      # host build exists only for that runtime. Tagged releases deliberately
      # publish AArch64 Android instead, matching real phones and tablets.
      termux-host-command: |
        target_dir="$RUNNER_TEMP/hive-memory-termux-target"
        cargo build --release --locked --target "$RUST_TARGET" --target-dir "$target_dir"
        mkdir -p .termux-ci
        install -m 0755 \
          "$target_dir/$RUST_TARGET/release/hm" \
          .termux-ci/hm

  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@2a6119d7886443929e1961a0e11b8dafa71c1978
    with:
      matrix-set: full
      profiles: base
      shellcheck-inventory-path: .github/shellcheck-files.txt
      # Shell-owned release behavior lives under tests/shell. Cargo integration
      # tests stay in the conventional tests/*.rs location.
      test-command: |
        set -euo pipefail
        tests/shell/install-test
        tests/shell/release-scripts-test
        tests/shell/automation-test

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This
      # gate verifies every unavoidable action literal and all vendored release
      # scripts still match that single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@2a6119d7886443929e1961a0e11b8dafa71c1978

  source-install:
    name: Locked source install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install from the locked checkout
        run: cargo install --path . --locked --root "$RUNNER_TEMP/hive-memory-install"

      - name: Smoke installed binary
        run: |
          "$RUNNER_TEMP/hive-memory-install/bin/hm" --version

  performance-budget:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # These tests are intentionally separate from the default suite because
      # they create large synthetic stores/outboxes and measure real CLI
      # process latency.
      - name: Check context/search/flush budgets
        env:
          # GitHub's shared runners have materially higher process-startup and
          # filesystem latency than a warmed local developer machine. Keep the
          # benchmark enforced in CI, but calibrate the threshold to this runner
          # class instead of using the stricter local budget verbatim.
          HIVE_MEMORY_PERF_BUDGET_MULTIPLIER: 4
        # Serialize wall-clock samples so the budgets measure each path rather
        # than cross-test contention between multiple 5,000-note fixtures.
        run: cargo test --release --locked --test perf_budget -- --ignored --nocapture --test-threads=1

  cloud-sync-sim:
    name: Cloud sync simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Simulate the file-level behaviors cloud drives tend to produce around
      # agent writes: independent files merging, conflict copies, and renames.
      - name: Run cloud sync simulation
        run: cargo test --locked --test cloud_sync_sim -- --ignored --nocapture
