# shellcheck shell=bash
# shellcheck disable=SC2034  # consumed by release-lib.sh after sourcing
#
# Per-project inputs to the shared release scripts vendored from
# cgraf78/actions. Everything else about the release flow lives in
# scripts/release-lib.sh and must not be forked here.

RELEASE_ENV_PREFIX=HIVE_MEMORY
RELEASE_SLUG=hive-memory
# The published binary and archive are named for the CLI, not the repo.
RELEASE_ASSET_NAME=hm
RELEASE_BINARY=hm

# Ask the shared cgraf78/actions renderer to publish a self-contained top-level
# installer. The generated file is checked in so users need only this repository
# and a POSIX host toolchain, not the Actions checkout, at installation time.
RELEASE_STANDALONE_INSTALLER=true

RELEASE_PAYLOAD_FILES=(
  README.md
  LICENSE
  man/man1/hm.1
)
